# KRaft mode dev config
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9093

# Listeners: INTERNAL for Docker network, EXTERNAL for host access
listeners=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
advertised.listeners=INTERNAL://kafka:9092,EXTERNAL://192.168.10.6:9094
listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=INTERNAL
controller.listener.names=CONTROLLER

# Topic settings
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
num.partitions=1

# Logs
log.dirs=/var/lib/kafka/data
